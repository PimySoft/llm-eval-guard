[project]
name = "llm-eval-guard"
version = "0.1.0"
description = "CI/CD quality gate framework for LLM and RAG applications: metric, schema, and security testing with a pytest-native workflow."
authors = [
    {name = "Rocco Salvetti"}
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pydantic (>=2)",
    "typer (>=0.27.2,<0.28.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "rich (>=13.6.0,<15.0.0)"
]


[project.optional-dependencies]
deepeval = ["deepeval (>=4.2.5,<5.0.0)"]
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.8,<0.17.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)"
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
files = ["llm_eval_guard", "tests"]
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "eval_metric(name, threshold): declarative metric threshold assertion",
    "calibration: judge calibration check against human-labeled ground truth",
]
