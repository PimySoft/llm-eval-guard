[project]
name = "llm-eval-guard"
version = "0.1.0"
description = "CI/CD quality gate framework for LLM and RAG applications: metric, schema, and security testing with a pytest-native workflow."
authors = [
    {name = "Rocco Salvetti"}
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10,<3.13"
keywords = [
    "llm",
    "rag",
    "evaluation",
    "testing",
    "ci-cd",
    "pytest",
    "prompt-injection",
    "red-team",
    "quality-gate",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Framework :: Pytest",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pydantic (>=2)",
    "typer (>=0.27.2,<0.28.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "rich (>=13.6.0,<15.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)"
]

[project.urls]
Homepage = "https://github.com/PimySoft/llm-eval-guard"
Repository = "https://github.com/PimySoft/llm-eval-guard"
Documentation = "https://github.com/PimySoft/llm-eval-guard/tree/main/docs"
Issues = "https://github.com/PimySoft/llm-eval-guard/issues"
Changelog = "https://github.com/PimySoft/llm-eval-guard/blob/main/CHANGELOG.md"

[project.optional-dependencies]
deepeval = ["deepeval (>=4.2.5,<5.0.0)", "ollama (>=0.6.2,<1.0.0)"]

[project.scripts]
leg = "llm_eval_guard.cli:app"

[project.entry-points.pytest11]
llm_eval_guard = "llm_eval_guard.pytest_plugin"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.8,<0.17.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "types-pyyaml (>=6.0.12.20260906,<7.0.0.0)",
    "coverage[toml] (>=7.10,<8.0)"
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
files = ["llm_eval_guard", "examples", "tests"]
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
asyncio_default_fixture_loop_scope = "function"
# A deprecation our own code triggers fails the run instead of scrolling past in the summary;
# deepeval's own get_event_loop() call (live judge runs, Python 3.12) is upstream, not ours.
filterwarnings = [
    "error::DeprecationWarning:llm_eval_guard",
    "ignore:There is no current event loop:DeprecationWarning:deepeval",
]
markers = [
    "eval_metric(name, threshold): declarative metric threshold assertion",
    "calibration: judge calibration check against human-labeled ground truth",
    "live_llm: exercises a real local Ollama call (skipped automatically if unreachable)",
]

# Why `coverage run -m pytest`, not pytest-cov: our pytest11 entry point imports llm_eval_guard
# before pytest-cov starts measuring, so every module-level line read as uncovered (67% vs 96%).
[tool.coverage.run]
source = ["llm_eval_guard"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
