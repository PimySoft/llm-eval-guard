name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same PR/branch instead of burning free-tier minutes on stale
# pushes (plan.md Phase 5.4 cost/time controls).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEFAULT_PYTHON: "3.12"

jobs:
  # Phase 5.4: skip the (comparatively slow) eval/security/schema-drift jobs on PRs that only
  # touch docs — a README typo fix shouldn't need to spin up Ollama. lint/unit-tests stay
  # unconditional: they're fast and also catch issues in the doc-adjacent code itself.
  changes:
    runs-on: ubuntu-latest
    outputs:
      eval: ${{ steps.filter.outputs.eval }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            eval:
              - 'llm_eval_guard/**'
              - 'datasets/**'
              - 'examples/**'
              - 'prompts/**'
              - 'tests/**'
              - 'leg.config.yaml'
              - 'pyproject.toml'
              - 'poetry.lock'

  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-poetry
        with:
          python-version: ${{ matrix.python-version }}
      - name: Ruff lint
        run: poetry run ruff check .
      - name: Ruff format --check
        run: poetry run ruff format --check .
      - name: mypy
        run: poetry run mypy

  unit-tests:
    # No Ollama on this job on purpose: pytest_plugin.py auto-skips `live_llm`-marked tests when
    # Ollama isn't reachable, so this stays the fast, network-free "unit-tests" job plan.md Phase
    # 5.1 asks for without needing marker filtering here.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-poetry
        with:
          python-version: ${{ matrix.python-version }}
      - name: pytest (with coverage)
        run: poetry run coverage run -m pytest
      - name: coverage gate (fail_under = 80, pyproject.toml)
        run: poetry run coverage report

  schema-drift:
    # Phase 3.3's `leg run --fast` path: schema validation + prompt-drift, zero network calls.
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.eval == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-poetry
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - name: leg run --fast
        run: poetry run leg run --fast

  eval-suite:
    # Runs the quality metrics end-to-end under the `ci` judge profile: a fast, uncalibrated
    # smoke-check judge, because the calibrated qwen2.5:7b is too slow for a free CPU runner.
    # Gated on pytest, not `leg run`'s exit code: under the ci judge the judge-scored tests are
    # strict xfails, so pytest stays green on known judge noise and red on real breakage — or on
    # an unexpected pass. See docs/ci-setup.md and docs/judge-calibration.md.
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.eval == 'true'
    env:
      OLLAMA_BASE_URL: http://localhost:11434
      # ci smoke-check judge: LEG_JUDGE_MODEL for pytest fixtures, LEG_JUDGE_PROFILE for `leg run`
      # (leg.config.yaml judge_profiles.ci) — keep the two in sync.
      LEG_JUDGE_MODEL: qwen2.5:0.5b
      LEG_JUDGE_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-poetry
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - uses: ./.github/actions/setup-ollama
        with:
          model: ${{ env.LEG_JUDGE_MODEL }}
      - name: Cache judge-call results (core/cache.py)
        uses: actions/cache@v4
        with:
          path: .leg_cache
          key: judge-cache-eval-${{ hashFiles('datasets/golden/**') }}
      - name: pytest -m live_llm (quality metrics)
        run: |
          poetry run pytest -m live_llm -v \
            tests/integration/test_deepeval_adapter.py \
            tests/integration/test_faithfulness.py \
            tests/integration/test_answer_relevancy.py \
            "tests/integration/test_cli_run.py::test_run_quality_suite_end_to_end"
      - name: Generate report
        if: always()
        run: poetry run leg run --suite quality --report-dir reports/eval-suite || true
      - name: Append to job summary
        if: always()
        run: cat reports/eval-suite/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-suite-report
          path: reports/eval-suite

  demo-rag:
    # Phase 9: the demo app (examples/demo_rag) answers its questions for real, then `leg run
    # --suite demo` gates on its exit code. That suite is deterministic (context_recall), so
    # unlike eval-suite it needs no judge and no xfails — any red is a real retrieval regression.
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.eval == 'true'
    env:
      OLLAMA_BASE_URL: http://localhost:11434
      # The app's generator model; 0.5b (not the local 3b default) keeps a CPU runner fast, and
      # the gated metric only reads retrieval, not the answer.
      LEG_DEMO_MODEL: qwen2.5:0.5b
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-poetry
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - uses: ./.github/actions/setup-ollama
        with:
          model: ${{ env.LEG_DEMO_MODEL }}
      - name: Cache generated answers (core/cache.py GenerationCache)
        uses: actions/cache@v4
        with:
          path: .leg_cache
          key: demo-cache-${{ hashFiles('examples/**', 'prompts/**') }}
      - name: leg run --suite demo (gate)
        run: poetry run leg run --suite demo --report-dir reports/demo
      - name: Append to job summary
        if: always()
        run: cat reports/demo/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-rag-report
          path: reports/demo

  security-suite:
    # Same ci-judge rationale as eval-suite for the toxicity leg (the only judge-scored security
    # metric); compliance/task_completion/pii_leakage are rule-based and deterministic.
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.eval == 'true'
    env:
      OLLAMA_BASE_URL: http://localhost:11434
      # ci smoke-check judge: LEG_JUDGE_MODEL for pytest fixtures, LEG_JUDGE_PROFILE for `leg run`
      # (leg.config.yaml judge_profiles.ci) — keep the two in sync.
      LEG_JUDGE_MODEL: qwen2.5:0.5b
      LEG_JUDGE_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-poetry
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - uses: ./.github/actions/setup-ollama
        with:
          model: ${{ env.LEG_JUDGE_MODEL }}
      - name: Cache judge-call results (core/cache.py)
        uses: actions/cache@v4
        with:
          path: .leg_cache
          key: judge-cache-security-${{ hashFiles('datasets/redteam/**') }}
      - name: pytest -m live_llm (toxicity + full security suite)
        run: |
          poetry run pytest -m live_llm -v \
            tests/integration/test_toxicity.py \
            "tests/integration/test_cli_run.py::test_run_security_suite_end_to_end"
      - name: Generate report
        if: always()
        run: poetry run leg run --suite security --report-dir reports/security-suite || true
      - name: Append to job summary
        if: always()
        run: cat reports/security-suite/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-suite-report
          path: reports/security-suite
